name: Build AAB for Play Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source zip from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download source --repo "$GITHUB_REPOSITORY" --pattern v_player.zip --dir "$RUNNER_TEMP" --clobber

      - name: Extract source into workspace
        run: |
          unzip -q "$RUNNER_TEMP/v_player.zip" -d "$RUNNER_TEMP/src"
          cp -r "$RUNNER_TEMP/src/v_player/." "$GITHUB_WORKSPACE/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (প্রথমবার)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.vplayer --project-name v_player --platforms android .
          fi

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Patch Android config
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: python3 scripts/setup_android.py

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: v-player-aab
          path: build/app/outputs/bundle/release/app-release.aab
